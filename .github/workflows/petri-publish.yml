name: Petri bundle integrity

# Integrity guardrail for the Petri audit bundle under
# docs/self-improving/petri-bundle/. The downstream site renders it from the
# publication bundle (docs/architecture/publication-bundle.md); this workflow
# keeps the raw logs valid. It runs on every PR that touches the bundle, the
# validator, the hygiene ratchet, or this workflow file, plus a daily cron and
# manual dispatch. It does NOT deploy.

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/self-improving/petri-bundle/**"
      - "scripts/validate_petri_bundle.py"
      - "scripts/check_repo_hygiene.py"
      - ".github/workflows/petri-publish.yml"
  pull_request:
    paths:
      - "docs/self-improving/petri-bundle/**"
      - "scripts/validate_petri_bundle.py"
      - "scripts/check_repo_hygiene.py"
      - ".github/workflows/petri-publish.yml"
  schedule:
    # 09:00 KST = 00:00 UTC. Daily integrity check.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petri-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync dev group
        # `zipfile-zstd` lives in the dev group so the validator can open
        # zstd-compressed .eval archives without pulling the heavy [audit]
        # extra.
        run: uv sync --locked

      - name: Hygiene ratchet (petri delete-protection)
        run: uv run python scripts/check_repo_hygiene.py

      - name: Validator (deep — listing + zip + scores + assets)
        run: uv run python scripts/validate_petri_bundle.py

      - name: Diff vs main (regression sentinel)
        # On PRs: warn if any .eval file vanished compared to main. The
        # hygiene ratchet already enforces the count floor; this surfaces
        # the specific name(s) for the PR reviewer.
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
          base="origin/$PR_BASE_REF"
          missing=$(git diff --name-only --diff-filter=D "${base}"...HEAD \
            -- 'docs/self-improving/petri-bundle/logs/*.eval' 'docs/self-improving/petri-bundle/assets/**')
          if [ -n "${missing}" ]; then
            echo "::warning::Petri bundle files removed vs ${base}:"
            while IFS= read -r path; do
              printf '::warning:: - %s\n' "$path"
            done <<< "$missing"
          fi
