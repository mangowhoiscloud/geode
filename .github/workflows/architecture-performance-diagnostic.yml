name: Architecture performance diagnostic

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/architecture-performance-ratchet-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - run: uv sync --extra audit
      - name: Profile isolated first turn without changing acceptance samples
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          code = '''
          import cProfile
          import json
          import pstats
          import sys
          from core.agent.loop import AgenticLoop
          from scripts import check_architecture_performance as checker

          original = AgenticLoop.arun
          async def profile_turn(self, *args, **kwargs):
              profile = cProfile.Profile()
              profile.enable()
              try:
                  return await original(self, *args, **kwargs)
              finally:
                  profile.disable()
                  print("FIRST TURN PROFILE: diagnostic only, not acceptance", file=sys.stderr)
                  pstats.Stats(profile, stream=sys.stderr).strip_dirs().sort_stats("cumulative").print_stats(45)
                  print("SELF TIME PROFILE", file=sys.stderr)
                  pstats.Stats(profile, stream=sys.stderr).strip_dirs().sort_stats("tottime").print_stats(20)
          AgenticLoop.arun = profile_turn
          print(json.dumps(checker._measure_probe(), sort_keys=True))
          '''
          # This is a separate, unscored process. The original three-sample
          # wall-clock gate below is unchanged and remains independently required.
          with tempfile.TemporaryDirectory(prefix="geode-profile-") as temp:
              root = Path(temp)
              env = os.environ.copy()
              env.update({
                  "PYTHONPATH": str(Path.cwd()),
                  "CODEX_HOME": str(root / "codex"),
                  "GEODE_COGNITIVE_REFLECTION_ENABLED": "false",
                  "GEODE_HOME": str(root / "home"),
                  "GEODE_STATE_ROOT": str(root / "state"),
                  "GEODE_VERIFY_MODE": "off",
                  "_GEODE_ARCHITECTURE_PERFORMANCE_PROBE": "1",
              })
              subprocess.run([sys.executable, "-c", code], cwd=root, env=env,
                             check=True, timeout=120)
          PY
      - name: Unchanged three-sample performance acceptance
        run: uv run python scripts/check_architecture_performance.py --check
