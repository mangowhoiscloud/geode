name: Architecture performance diagnostic

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: architecture-ratchet-candidate
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/architecture-performance-guards-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Inspect owned checkout and apply pinned-source changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short --branch
          git worktree list
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test ! -e .owner
          printf 'session=performance-ratchet\ntask_id=architecture-performance-guards-20260917\n' > .owner
          cp .github/publish-ratchet-3356.py "$RUNNER_TEMP/publish-ratchet-3356.py"
          python .github/ratchet-3356.py
          git rm .github/ratchet-3356.py .github/publish-ratchet-3356.py \
            .github/workflows/architecture-performance-diagnostic.yml
      - run: uv sync --extra audit
      - name: Targeted runtime and checker regression tests
        run: |
          uv run ruff format core/memory/fts_query.py scripts/check_architecture_performance.py \
            tests/core/memory/test_hermes_1c_fts5.py tests/scripts/test_check_architecture_performance.py
          uv run pytest -q -o addopts= tests/core/memory/test_hermes_1c_fts5.py \
            tests/scripts/test_check_architecture_performance.py
      - name: Static contracts
        run: |
          uv run ruff check core/ evals/ evolve/ tests/ scripts/
          uv run mypy core/ evals/ evolve/ scripts/
          uv run lint-imports --no-cache
      - name: Regenerate canonical architecture and public documentation mirrors
        run: |
          uv run python scripts/architecture_baseline.py --update
          npm --prefix site ci
          npm --prefix site run sync-stats
          npm --prefix site run build
          npm --prefix site run export-md
          npm --prefix site run test:docs
          uv run python scripts/check_official_docs.py --check-map
      - name: Verify staged scope and publish an unreferenced candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add core/memory/fts_query.py scripts/check_architecture_performance.py \
            tests/core/memory/test_hermes_1c_fts5.py tests/scripts/test_check_architecture_performance.py \
            .github/workflows/ci.yml .agents/skills/geode-workflow/references/verification-gates.md \
            CHANGELOG.md AGENTS.md docs/architecture/extensibility-roadmap.md \
            site/src/data/geode/architecture-baseline.json site/src/data/geode/changelog.ts \
            site/src/data/geode/sot.ts site/public/llms.txt site/public/llms-full.txt
          uv run python scripts/check_repo_hygiene.py
          git diff --cached --check
          git diff --cached --stat
          python "$RUNNER_TEMP/publish-ratchet-3356.py"
