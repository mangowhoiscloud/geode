name: Deploy redirect site to GitHub Pages

# GEODE's docs, self-improving hub and research readers moved to
# https://mangowhois.ai/products/geode/ and https://tech.mangowhois.ai/.
# mangowhoiscloud.github.io/geode/ now serves redirects only: one stub per
# frozen old page (github-pages/redirect-paths.json) and a 404 page that maps
# any other old address with the same rules (github-pages/rules.js).
# See docs/architecture/official-docs-generation.md#github-pages-redirects.
#
# Prerequisite: Pages source = "GitHub Actions" (repo Settings → Pages).

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - "scripts/build_pages_redirects.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    # Required checks must also exist for PRs that do not touch the redirects.
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  # Render-lint gate — malformed markdown/YAML/JSON in the render-gated docs
  # and the petri bundle data. See docs/architecture/render-lint.md.
  lint:
    name: Render lint (markdown + YAML + JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lint tools (pinned)
        run: |
          python -m pip install --upgrade pip
          # Versions pinned to match .pre-commit-config.yaml so local
          # `pre-commit run` and CI report the same violations.
          pip install yamllint==1.38.0 pymarkdownlnt==0.9.37

      - name: yamllint — petri YAML
        run: |
          shopt -s nullglob
          targets=(
            evals/petri/judge_dims/*.yaml
            evals/petri/judge_dims/*.yml
            docs/self-improving/petri-bundle/*.yaml
            docs/self-improving/petri-bundle/*.yml
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no YAML targets — skipping"
            exit 0
          fi
          yamllint --strict -c .yamllint.yaml "${targets[@]}"
        shell: bash

      - name: pymarkdown — Pages-published docs
        # The allowlist of render-gated files lives in
        # scripts/lint_pages_markdown.sh so pre-commit and CI lint the
        # same set. See docs/architecture/render-lint.md for the
        # legacy-doc carve-out policy.
        run: scripts/lint_pages_markdown.sh

      - name: JSON parse — petri bundle assets
        run: |
          shopt -s globstar nullglob
          targets=( docs/self-improving/petri-bundle/**/*.json )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no JSON targets — skipping"
            exit 0
          fi
          for f in "${targets[@]}"; do
            echo "validating $f"
            python -m json.tool "$f" > /dev/null
          done
        shell: bash

  build:
    name: Build (redirect site)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build redirect stubs and the 404 fallback
        run: node scripts/build_pages_redirects.mjs --out "$RUNNER_TEMP/pages"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
