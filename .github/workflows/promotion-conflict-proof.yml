name: Promotion conflict proof (temporary)
'on':
  push:
    branches: [verify/promotion-conflicts-3358-20260917]
permissions:
  contents: read
jobs:
  prove:
    if: github.repository == 'mangowhoiscloud/geode'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 190fe620678e5fc016ce3a97cc4f13be103eed5a
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Reproduce conflicts, verify resolutions and preview promotion
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          D = '22bb6505db8163d1113b598c0c965a7bf4993077'
          M = '29e6ab2651f3805a1936be3ac7db30dde773c92d'
          C = '190fe620678e5fc016ce3a97cc4f13be103eed5a'
          TREE = '6daf74f8407c38d2f5464f8fe0b39ede64da1a9e'
          BRANCH = 'sync/main-into-develop-fts-ratchet-20260917'
          ALLOWED = {
              '.agents/skills/geode-workflow/references/verification-gates.md',
              '.github/workflows/architecture-performance-diagnostic.yml',
              '.github/workflows/ci.yml', 'CHANGELOG.md', 'core/memory/fts_query.py',
              'docs/architecture/extensibility-roadmap.md',
              'scripts/check_architecture_performance.py', 'site/public/llms-full.txt',
              'site/src/data/geode/architecture-baseline.json', 'site/src/data/geode/changelog.ts',
              'tests/core/memory/test_hermes_1c_fts5.py',
              'tests/scripts/test_check_architecture_performance.py',
          }
          ROOT = Path.cwd()

          def git(*args, cwd=ROOT, check=True):
              p = subprocess.run(['git', *args], cwd=cwd, capture_output=True, text=True, timeout=120)
              if check and p.returncode:
                  raise RuntimeError(f'git {args} failed ({p.returncode}): {p.stderr}')
              return p

          def out(*args, cwd=ROOT):
              return git(*args, cwd=cwd).stdout.strip()

          def require(ok, reason):
              if not ok:
                  raise RuntimeError(reason)

          def refresh():
              git('fetch', '--no-tags', 'origin',
                  'refs/heads/develop:refs/remotes/origin/develop',
                  'refs/heads/main:refs/remotes/origin/main',
                  f'refs/heads/{BRANCH}:refs/remotes/origin/{BRANCH}')
              require(out('rev-parse', 'origin/develop') == D, 'develop moved')
              require(out('rev-parse', 'origin/main') == M, 'main moved')
              require(out('rev-parse', f'origin/{BRANCH}') == C, 'sync candidate moved')

          def workspace(name, ref):
              path = Path(os.environ['RUNNER_TEMP']) / name
              require(not path.exists(), f'workspace already exists: {path}')
              git('worktree', 'add', '--detach', str(path), ref)
              require(not out('status', '--porcelain', cwd=path), 'checkout is not clean')
              marker = path / '.owner'
              require(not marker.exists(), 'ownership marker already exists')
              marker.write_text(f'session=promotion-conflict-proof\ntask_id={name}\n')
              return path

          print(out('status', '--short', '--branch'), flush=True)
          print(out('worktree', 'list'), flush=True)
          require(out('rev-parse', 'HEAD') == C, 'incorrect checkout')
          refresh()
          require(out('show', '-s', '--format=%P', C).split() == [D, M], 'wrong ordered parents')
          require(out('rev-parse', f'{C}^{{tree}}') == TREE, 'candidate tree differs')
          require(out('rev-parse', f'{D}^{{tree}}') == TREE, 'develop tree differs')
          previous = out('rev-parse', f'{D}^')
          require(out('rev-parse', f'{M}^{{tree}}') == out('rev-parse', f'{previous}^{{tree}}'),
                  'main contains independent content; automatic preservation is not authorized')
          require(git('merge-base', '--is-ancestor', previous, D, check=False).returncode == 0,
                  'content-equivalent commit is not an ancestor of develop')
          changed = set(filter(None, git('diff', '--name-only', '-z', M, D).stdout.split('\0')))
          require(changed == ALLOWED, f'unexpected tip differences: {sorted(changed ^ ALLOWED)}')
          print('TIP_CONTENT_DIFF\n' + out('diff', '--stat', M, D), flush=True)

          work = workspace('geode-promotion-conflict-3358', D)
          merge = git('-c', 'user.name=github-actions[bot]',
                      '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                      '-c', 'rerere.enabled=false', 'merge', '--no-ff', '--no-commit', M,
                      cwd=work, check=False)
          print('MERGE_REPRODUCTION_EXIT=' + str(merge.returncode), flush=True)
          print(merge.stdout + merge.stderr, flush=True)
          conflicts = set(filter(None, git('diff', '--name-only', '--diff-filter=U', '-z', cwd=work).stdout.split('\0')))
          require(merge.returncode == 0 or (merge.returncode == 1 and conflicts), 'merge failed beyond content conflicts')
          require(out('rev-parse', 'MERGE_HEAD', cwd=work) == M, 'merge did not preserve main parent')
          print('UNMERGED_STAGES\n' + out('ls-files', '-u', cwd=work), flush=True)

          paths = conflicts | set(filter(None, git('diff', '--cached', '--name-only', '-z', D, cwd=work).stdout.split('\0')))
          paths |= set(filter(None, git('diff', '--name-only', '-z', cwd=work).stdout.split('\0')))
          require(paths <= ALLOWED, f'out-of-scope merge changes: {sorted(paths - ALLOWED)}')
          for path in sorted(paths):
              # Full-tree equality proves that main has no independent edits.
              # Preserve the later tested #3357 result, including intentional deletion.
              require(out('ls-tree', M, '--', path) == out('ls-tree', previous, '--', path),
                      f'independent main change in {path}')
              print(json.dumps({'path': path, 'conflicted': path in conflicts,
                                'decision': 'preserve_verified_develop',
                                'main_entry': out('ls-tree', M, '--', path),
                                'develop_entry': out('ls-tree', D, '--', path)}, ensure_ascii=False), flush=True)
              git('restore', f'--source={D}', '--staged', '--worktree', '--', path, cwd=work)
          require(not out('ls-files', '-u', cwd=work), 'unresolved entries remain')
          require(out('write-tree', cwd=work) == TREE, 'resolved tree differs from verified candidate')
          git('diff', '--cached', '--check', cwd=work)
          git('diff', '--exit-code', cwd=work)

          for command in [
              ['uv', 'sync', '--extra', 'audit'],
              ['uv', 'run', 'pytest', '-q', '-o', 'addopts=',
               'tests/core/memory/test_hermes_1c_fts5.py',
               'tests/scripts/test_check_architecture_performance.py'],
              ['uv', 'run', 'python', 'scripts/architecture_baseline.py', '--check'],
              ['uv', 'run', 'python', 'scripts/resolve_architecture_roadmap_trust.py',
               '--event-mode', 'pull_request', '--target-branch', 'develop', '--head-ref', BRANCH,
               '--head-repo', 'mangowhoiscloud/geode', '--repository', 'mangowhoiscloud/geode',
               '--head-sha', C, '--require-trust', 'main'],
          ]:
              print('VERIFY_COMMAND=' + json.dumps(command), flush=True)
              env = os.environ.copy()
              env['PYTHONPATH'] = str(work)
              subprocess.run(command, cwd=work, env=env, check=True, timeout=240)
          require(out('write-tree', cwd=work) == TREE, 'verification changed index')
          git('diff', '--exit-code', D, cwd=work)

          promotion = workspace('geode-promotion-preview-3358', M)
          preview = git('-c', 'user.name=github-actions[bot]',
                        '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                        'merge', '--no-ff', '--no-commit', C, cwd=promotion)
          print('PROMOTION_PREVIEW\n' + preview.stdout + preview.stderr, flush=True)
          require(not out('ls-files', '-u', cwd=promotion), 'promotion preview conflicts')
          require(out('write-tree', cwd=promotion) == TREE, 'promotion would change verified content')
          refresh()
          receipt = {'candidate_head': C, 'ordered_parents': [D, M], 'resolved_tree': TREE,
                     'main_content_equals_develop_parent': previous,
                     'conflict_paths': sorted(conflicts), 'resolved_paths': sorted(paths),
                     'develop_content_diff': 0, 'promotion_preview_conflicts': 0,
                     'remote_refs_modified_by_runner': False}
          print('VERIFIED_PROMOTION_CONFLICT_RECEIPT\n' + json.dumps(receipt, indent=2), flush=True)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Conflict proof\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY
