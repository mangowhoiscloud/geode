name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required jobs always report a result. Full runtime tests may skip only
  # when every changed path is in the exact documentation allowlist below.
  # Existing code/docs filters continue to own other checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      full_tests: ${{ steps.filter.outputs.full_tests }}
    steps:
      - name: Reject standalone main-to-develop sync PRs
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'develop' &&
          (github.head_ref == 'main' || startsWith(github.head_ref, 'sync/'))
        run: |
          echo "::error::Merge current main into the feature branch before integration; do not open a sync PR."
          exit 1
      - name: Validate push comparison base
        if: github.event_name == 'push'
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ ! "$PUSH_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$PUSH_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::Change detection requires a non-zero github.event.before SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # PRs keep the complete API diff; pushes compare before -> current SHA.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'core/**'
              - 'evals/**'
              - 'evolve/**'
              - 'scripts/**'
              - 'tests/**'
              - '.agents/**'
              - '.geode/**'
              - '.claude/skills/geode-eval'
              - '.claude/hooks/**'
              - 'AGENTS.md'
              - 'GEODE.md'
              - 'CHANGELOG.md'
              - '.pre-commit-config.yaml'
              - 'docs/architecture/exception-debt.*'
              - 'docs/architecture/context-var-lifecycles.json'
              - 'docs/architecture/extensibility-roadmap.md'
              - 'docs/eval/**'
              - 'site/scripts/**'
              - 'site/src/**'
              - 'site/package.json'
              - 'site/package-lock.json'
              - 'site/public/llms.txt'
              - 'site/public/llms-full.txt'
              - 'state/autoresearch/**'
              - 'pyproject.toml'
              - 'ruff-production.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            docs:
              - 'README.md'
              - 'README.ko.md'
              - 'CHANGELOG.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'docs/workflow.md'
              - 'docs/scaffold-skills.md'
              - 'docs/architecture/*.md'
              - 'docs/eval/**'
              - 'site/src/data/geode/sot.ts'
              - 'site/src/data/geode/changelog.ts'
              - 'site/src/data/geode/architecture-baseline.json'
              - 'site/public/llms.txt'
              - 'site/public/llms-full.txt'
            # Unknown paths stay full. Do not generalize these exclusions to
            # docs/**, Markdown, site source, runtime guidance or schemas.
            # Public generated files remain checked by the required Pages job.
            full_tests:
              - '**'
              - '!README.md'
              - '!README.ko.md'
              - '!CHANGELOG.md'
              - '!CLAUDE.md'
              - '!docs/workflow.md'
              - '!docs/scaffold-skills.md'
              - '!docs/architecture/official-docs-generation.md'
              - '!docs/architecture/extensibility-roadmap.md'
              - '!site/src/data/geode/sot.ts'
              - '!site/src/data/geode/changelog.ts'
              - '!site/src/data/geode/architecture-baseline.json'
              - '!site/public/llms.txt'
              - '!site/public/llms-full.txt'

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip — no code change
        if: needs.changes.outputs.code != 'true' && needs.changes.outputs.docs != 'true'
        run: echo "::notice::Docs-only PR — skipping lint."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
      - if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
        run: uv sync --locked
      - name: Documentation owner paths and scaffold contracts
        if: needs.changes.outputs.docs == 'true'
        run: |
          uv run python scripts/check_official_docs.py --check-map
          uv run pytest -q tests/test_workflow_scaffold.py \
            tests/integration/test_check_official_docs.py \
            tests/integration/test_render_lint_config.py
      - if: needs.changes.outputs.code == 'true'
        run: uv run ruff check core/ evals/ evolve/ tests/ scripts/
      - name: Production annotation contract
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check --config ruff-production.toml core/ evals/ evolve/
      - if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check core/ evals/ evolve/ tests/ scripts/
      - name: Install pinned automation analyzers
        if: needs.changes.outputs.code == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Workflow and shell contracts
        if: needs.changes.outputs.code == 'true'
        run: scripts/lint_automation.sh
      - name: Dependency drift (deptry)
        if: needs.changes.outputs.code == 'true'
        run: uv run deptry .
      - name: Legacy import ratchet
        if: needs.changes.outputs.code == 'true'
        env:
          LEGACY_EVENT_MODE: ${{ github.event_name }}
          LEGACY_PR_BASE_REF: refs/remotes/origin/${{ github.base_ref || github.ref_name }}
          LEGACY_PUSH_BASE_REF: ${{ github.event.before }}
        run: |
          base_ref="$LEGACY_PR_BASE_REF"
          if [[ "$LEGACY_EVENT_MODE" == "push" ]]; then
            if [[ ! "$LEGACY_PUSH_BASE_REF" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$LEGACY_PUSH_BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
              echo "::error::Legacy import validation requires a non-zero github.event.before SHA."
              exit 1
            fi
            base_ref="$LEGACY_PUSH_BASE_REF"
          fi
          uv run python scripts/check_legacy_imports.py --base-ref "$base_ref"
      - name: Repo hygiene ratchet
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/check_repo_hygiene.py
      - name: Generated architecture baseline
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/architecture_baseline.py --check
      - name: Architecture import contracts
        if: needs.changes.outputs.code == 'true'
        run: uv run lint-imports --no-cache
      - name: Architecture exception debt
        if: needs.changes.outputs.code == 'true'
        env:
          EXCEPTION_EVENT_MODE: ${{ github.event_name }}
          EXCEPTION_PR_BASE_REF: origin/${{ github.base_ref || github.ref_name }}
          EXCEPTION_PUSH_BASE_REF: ${{ github.event.before }}
        run: |
          base_ref="$EXCEPTION_PR_BASE_REF"
          if [[ "$EXCEPTION_EVENT_MODE" == "push" ]]; then
            if [[ ! "$EXCEPTION_PUSH_BASE_REF" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$EXCEPTION_PUSH_BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
              echo "::error::Exception validation requires a non-zero github.event.before SHA."
              exit 1
            fi
            base_ref="$EXCEPTION_PUSH_BASE_REF"
          fi
          uv run python scripts/check_architecture_exceptions.py \
            --check \
            --base-ref "$base_ref"
      - name: Architecture roadmap invariants
        if: needs.changes.outputs.code == 'true'
        env:
          ROADMAP_EVENT_MODE: ${{ github.event_name }}
          ROADMAP_PR_BASE_REF: refs/remotes/origin/${{ github.base_ref || github.ref_name }}
          ROADMAP_PR_HEAD_REF: ${{ github.head_ref }}
          ROADMAP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROADMAP_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ROADMAP_REPOSITORY: ${{ github.repository }}
          ROADMAP_PUSH_BASE_REF: ${{ github.event.before }}
          ROADMAP_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          base_ref="$ROADMAP_PR_BASE_REF"
          if [[ "$ROADMAP_EVENT_MODE" == "push" ]]; then
            if [[ ! "$ROADMAP_PUSH_BASE_REF" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$ROADMAP_PUSH_BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
              echo "::error::Push validation requires a non-zero github.event.before SHA."
              exit 1
            fi
            base_ref="$ROADMAP_PUSH_BASE_REF"
          fi
          trusted_ref="$(uv run python scripts/resolve_architecture_roadmap_trust.py \
            --event-mode "$ROADMAP_EVENT_MODE" \
            --target-branch "$ROADMAP_TARGET_BRANCH" \
            --head-ref "$ROADMAP_PR_HEAD_REF" \
            --head-repo "$ROADMAP_PR_HEAD_REPO" \
            --repository "$ROADMAP_REPOSITORY" \
            --head-sha "$ROADMAP_PR_HEAD_SHA")"
          args=(
            --check
            --base-ref "$base_ref"
            --target-branch "$ROADMAP_TARGET_BRANCH"
            --event-mode "$ROADMAP_EVENT_MODE"
          )
          case "$trusted_ref" in
            refs/remotes/origin/main)
              args+=(--trusted-main-ref "$trusted_ref")
              ;;
            refs/remotes/origin/develop)
              args+=(--trusted-develop-ref "$trusted_ref")
              ;;
            "") ;;
            *)
              echo "::error::Roadmap trust resolver returned an unknown ref: $trusted_ref"
              exit 1
              ;;
          esac
          uv run python scripts/check_architecture_roadmap.py "${args[@]}"
      - name: llms.txt version drift ratchet
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/check_llms_version.py
      - name: Evaluation catalog and contract ratchet
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/eval/contract.py catalog --check
      - name: Petri bundle ratchet
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/validate_petri_bundle.py
      - name: Hero viz layout ratchet
        if: needs.changes.outputs.code == 'true'
        # Static check — validates the committed
        # ``scripts/visualizations/layout_baseline.json`` against the
        # ``SITES`` list in ``verify_hero_layout.py`` without importing
        # manim. Engineers refresh the baseline locally via
        # ``uv run python scripts/visualizations/verify_hero_layout.py
        # --update-baseline`` and commit the JSON; CI only enforces
        # that every recorded ratio is < 1.0 (no text-overflow).
        run: uv run python scripts/visualizations/verify_hero_layout.py --static-check
      - name: Official documentation drift
        if: needs.changes.outputs.code == 'true'
        run: uv run python scripts/check_official_docs.py --skip-build

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip — no code change
        if: needs.changes.outputs.code != 'true'
        run: echo "::notice::Docs-only PR — skipping typecheck."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: needs.changes.outputs.code == 'true'
      - if: needs.changes.outputs.code == 'true'
        run: uv sync --locked --extra audit
      - if: needs.changes.outputs.code == 'true'
        run: uv run mypy core/ evals/ evolve/ scripts/
      - name: Prompt integrity check
        if: needs.changes.outputs.code == 'true'
        run: uv run python -c "from core.llm.prompts import verify_prompt_integrity; verify_prompt_integrity(raise_on_drift=True)"

  test_contracts:
    name: Test contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # [audit] extra installs inspect_ai so tests/core/audit/ runs (otherwise
      # ``pytest.importorskip("inspect_ai.log")`` skips those modules
      # and the petri-bookkeeping code in core/audit/ shows up as 0%
      # covered — pushing total coverage below the 75% ratchet).
      - run: uv sync --locked --extra audit
      - name: Architecture behavior contracts
        run: |
          uv run pytest -q \
            tests/core/agent/test_loop_architecture_budget.py \
            tests/core/agent/test_loop_state_machine.py \
            tests/core/agent/test_approval_fsm.py \
            tests/core/agent/test_google_workspace_consent.py \
            tests/core/agent/test_subagent_architecture_budget.py \
            tests/core/agent/test_tool_plan_runtime_policy.py \
            tests/core/llm/test_retry_policy.py \
            tests/core/observability/test_event_store.py \
            tests/core/test_ipc_protocol.py \
            tests/core/tools/test_tool_plan.py \
            tests/integration/test_architecture_site_inventory.py \
            tests/integration/test_namespace_composition.py
      - name: Architecture performance contracts
        run: |
          uv run pytest -q tests/core/memory/test_hermes_1c_fts5.py \
            tests/scripts/test_check_architecture_performance.py
      - name: Architecture performance baseline
        id: architecture_performance
        run: uv run python scripts/check_architecture_performance.py --check
      - name: Architecture performance failure profile
        if: failure() && steps.architecture_performance.outcome == 'failure'
        run: uv run python scripts/check_architecture_performance.py --diagnose
      - name: Extension change-surface contracts
        run: uv run pytest -q tests/integration/test_extension_change_surfaces.py
      - name: Native Harbor 0.22 Docker contracts (no containers or model calls)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv run --isolated --no-project --with harbor==0.22.0 --with pytest==9.0.2 \
            python -B - <<'PY'
          import importlib.metadata
          import os
          import pytest
          assert importlib.metadata.version("harbor") == "0.22.0"
          raise SystemExit(pytest.main([
              "-q", "-c", "/dev/null", "--rootdir", os.environ["RUNNER_TEMP"],
              "--noconftest", "--import-mode=importlib", "-p", "no:cacheprovider",
              "tests/evals/platforms/test_harbor_docker.py",
          ]))
          PY
      - name: Build and inspect package artifacts
        run: |
          uv build
          uv run python scripts/check_package_artifacts.py
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --isolated --no-project --with "$wheel" \
            python -I scripts/check_installed_package.py
          kernel_wheel="$RUNNER_TEMP/$(basename "$wheel")"
          uv run python scripts/build_kernel_probe.py \
            --input-wheel "$wheel" --output-wheel "$kernel_wheel"
          uv run --isolated --no-project --with "$kernel_wheel" \
            python -I scripts/check_installed_package.py --kernel-only
          uv run --isolated --no-project --with "$kernel_wheel" --with pytest==9.0.2 \
            python -I -m pytest -q -c /dev/null --rootdir "$RUNNER_TEMP" \
            --import-mode=importlib --noconftest \
            tests/core/llm/adapters/test_registry.py \
            tests/core/tools/test_toolkit_registry.py
  test_shards:
    name: Test shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked --extra audit
      - name: Run tests with coverage (xdist parallel, loadfile)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_OUTPUT: ${{ runner.temp }}/test-shard-${{ matrix.shard }}
          COVERAGE_FILE: ${{ runner.temp }}/test-shard-${{ matrix.shard }}/.coverage.${{ matrix.shard }}
        # File hashing preserves the existing same-file state boundary; xdist
        # still keeps each file on one worker. Only the combined report gates 75%.
        # Pin config/root so external artifacts cannot change worker collection.
        run: |
          uv run pytest -c pyproject.toml --rootdir=. -p scripts.ci_test_shards \
            --ci-shard "$SHARD_INDEX" --ci-shards 4 --ci-shard-output "$SHARD_OUTPUT" \
            -n auto --dist=loadfile --cov=core --cov=evals --cov=evolve \
            --cov-report= --cov-fail-under=0 --junitxml="$SHARD_OUTPUT/junit.xml"
      - name: Preserve shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, test_contracts, test_shards]
    if: ${{ always() }}
    steps:
      - name: Require complete test prerequisites
        id: prerequisites
        env:
          TEST_NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTEST_GATE'
          import json
          import os
          import sys
          needs = json.loads(os.environ["TEST_NEEDS"])
          if set(needs) != {"changes", "test_contracts", "test_shards"}:
              sys.exit("::error::Missing test prerequisites")
          changes = needs["changes"]
          full = changes.get("outputs", {}).get("full_tests")
          if changes.get("result") != "success" or full not in {"true", "false"}:
              sys.exit("::error::Invalid full-test classification")
          expected = "success" if full == "true" else "skipped"
          if any(needs[key].get("result") != expected for key in ("test_contracts", "test_shards")):
              sys.exit("::error::Missing, failed, or cancelled test prerequisites")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"full_tests={full}\n")
          PYTEST_GATE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.prerequisites.outputs.full_tests == 'true'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: steps.prerequisites.outputs.full_tests == 'true'
      - run: uv sync --locked
        if: steps.prerequisites.outputs.full_tests == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.prerequisites.outputs.full_tests == 'true'
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/test-shards
      - name: Verify complete collection and combined coverage
        if: steps.prerequisites.outputs.full_tests == 'true'
        run: |
          uv run python scripts/ci_test_shards.py "$RUNNER_TEMP/test-shards"
          uv run coverage combine --keep \
            "$RUNNER_TEMP/test-shards/test-shard-0" \
            "$RUNNER_TEMP/test-shards/test-shard-1" \
            "$RUNNER_TEMP/test-shards/test-shard-2" \
            "$RUNNER_TEMP/test-shards/test-shard-3"
          uv run coverage report --show-missing

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip — no code change
        if: needs.changes.outputs.code != 'true'
        run: echo "::notice::Docs-only PR — skipping security scan."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: needs.changes.outputs.code == 'true'
      - if: needs.changes.outputs.code == 'true'
        run: uv sync --locked
      - name: Audit locked runtime dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          uv export --quiet --no-dev --no-emit-project --no-hashes \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/geode-runtime-requirements.txt"
          uv run pip-audit \
            -r "$RUNNER_TEMP/geode-runtime-requirements.txt" \
            --no-deps --disable-pip --progress-spinner=off
      - if: needs.changes.outputs.code == 'true'
        run: uv run bandit -r core/ evals/ evolve/ scripts/ -c pyproject.toml

  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [changes, lint, typecheck, test, security]
    env:
      GATE_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every prerequisite to succeed
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          required = {"changes", "lint", "typecheck", "test", "security"}
          needs = json.loads(os.environ["GATE_NEEDS"])
          failed = sorted(key for key in required if needs.get(key, {}).get("result") != "success")
          if set(needs) != required or failed:
              sys.exit(f"::error::Missing or non-success prerequisites: {failed}; received: {sorted(needs)}")
          if needs["changes"].get("outputs", {}).get("code") not in {"true", "false"}:
              sys.exit("::error::Change detection did not produce an explicit code classification")
          if needs["changes"].get("outputs", {}).get("docs") not in {"true", "false"}:
              sys.exit("::error::Change detection did not produce an explicit docs classification")
          if needs["changes"].get("outputs", {}).get("full_tests") not in {"true", "false"}:
              sys.exit("::error::Change detection did not produce an explicit full-tests classification")
          print("All required prerequisites succeeded on this workflow revision")
          PY
