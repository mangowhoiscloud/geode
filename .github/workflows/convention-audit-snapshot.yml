name: Convention audit verification

# Temporary branch-scoped verification. The final tree removes this workflow
# and its input. It creates Git objects only; the connector advances the ref.
on:
  push:
    branches: [fix/convention-static-audit-20260918]
    paths: [.github/audit-edits.json, .github/workflows/convention-audit-snapshot.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/convention-static-audit-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Apply exact reviewed file edits
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', '4bb73b909f2c4abd1332784b1b1fd802832a48eb', 'HEAD'], check=True)
          root = pathlib.Path.cwd()
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verification'
          report.mkdir(parents=True, exist_ok=True)
          (report / 'source.json').write_text(json.dumps({'source_sha': os.environ['GITHUB_SHA']}))
          records = json.loads((root / '.github/audit-edits.json').read_text())
          paths = []
          for name, before, after, mode, edits in records:
              path = root / name
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              data = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(data).hexdigest() == before, name
              lines = data.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(edits):
                  lines[start:end] = [replacement]
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == after, name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(mode & 0o777)
              paths.append(name)
          for name in ['.github/audit-edits.json', '.github/workflows/convention-audit-snapshot.yml']:
              (root / name).unlink()
              paths.append(name)
          subprocess.run(['git', 'add', '--update'], check=True)
          added = [name for name in paths if name != '.claude/hooks/check-progress.sh']
          subprocess.run(['git', 'add', '--', *added], check=True)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-paths.json').write_text(json.dumps(paths))
          PY
      - name: Install locked Python environment
        run: uv sync --locked --extra audit
      - name: Install pinned automation analyzers
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Regenerate architecture inventory
        run: uv run python scripts/architecture_baseline.py --update
      - name: Verify every Python and automation layer
        run: |
          python - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verification'
          report.mkdir(parents=True, exist_ok=True)
          commands = {
              'ruff': 'uv run ruff check core/ evals/ evolve/ tests/ scripts/',
              'annotations': 'uv run ruff check --config ruff-production.toml core/ evals/ evolve/',
              'format': 'uv run ruff format --check core/ evals/ evolve/ tests/ scripts/',
              'types': 'uv run mypy core/ evals/ evolve/ scripts/',
              'imports': 'uv run lint-imports --no-cache',
              'dependencies': 'uv run deptry .',
              'bandit': 'uv run bandit -r core/ evals/ evolve/ scripts/ -c pyproject.toml',
              'automation': 'scripts/lint_automation.sh',
              'exceptions': 'uv run python scripts/check_architecture_exceptions.py --check --base-ref origin/develop',
              'inventory': 'uv run python scripts/architecture_baseline.py --check',
              'targeted-tests': 'uv run pytest -q tests/core/ui/test_context_local.py tests/scripts/test_production_annotations.py tests/scripts/test_preflight.py tests/scripts/test_geo_host_preflight.py tests/scripts/test_progress_hook.py tests/scripts/test_automation_lint.py',
              'docs-map': 'uv run python scripts/check_official_docs.py --check-map',
          }
          results = []
          for name, command in commands.items():
              with (report / (name + '.log')).open('w') as output:
                  result = subprocess.run(shlex.split(command), stdout=output, stderr=subprocess.STDOUT, check=False)
              results.append({'name': name, 'command': command, 'exit_code': result.returncode})
              print(name, result.returncode, flush=True)
          (report / 'python-results.json').write_text(json.dumps(results, indent=2))
          sys.exit(int(any(row['exit_code'] for row in results)))
          PY
      - name: Install locked site environment
        run: npm ci
        working-directory: site
      - name: Regenerate and verify public site
        run: |
          python - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verification'
          commands = {
              'site-sync': 'npm run sync-stats',
              'site-lint': 'npm run lint',
              'site-types': 'npm run typecheck',
              'site-audit': 'npm audit --audit-level=moderate',
              'site-build': 'npm run build',
              'site-export': 'npm run export-md',
              'site-metadata': 'npm run verify-metadata',
          }
          results = []
          for name, command in commands.items():
              with (report / (name + '.log')).open('w') as output:
                  result = subprocess.run(shlex.split(command), cwd='site', stdout=output, stderr=subprocess.STDOUT, check=False)
              results.append({'name': name, 'command': command, 'exit_code': result.returncode})
              print(name, result.returncode, flush=True)
          (report / 'site-results.json').write_text(json.dumps(results, indent=2))
          sys.exit(int(any(row['exit_code'] for row in results)))
          PY
      - name: Export validated final Git objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verification'
          paths = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-paths.json').read_text())
          mirrors = [
              'AGENTS.md', 'docs/architecture/extensibility-roadmap.md',
              'site/src/data/geode/architecture-baseline.json',
              'site/src/data/geode/sot.ts', 'site/src/data/geode/changelog.ts',
              'site/public/llms.txt', 'site/public/llms-full.txt',
          ]
          allowed = set(paths + mirrors)
          subprocess.run(['git', 'add', '--', *mirrors], check=True)
          pending = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert not pending, pending
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed).issubset(allowed), changed
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          api = 'https://api.github.com/repos/mangowhoiscloud/geode'
          def request(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          assert request('/git/ref/heads/fix/convention-static-audit-20260918')['object']['sha'] == parent
          tree = []
          for name in changed:
              path = root / name
              if not path.exists():
                  tree.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              blob = request('/git/blobs', {'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              tree.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          base = request('/git/commits/' + parent)['tree']['sha']
          created_tree = request('/git/trees', {'base_tree': base, 'tree': tree})
          local_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert created_tree['sha'] == local_tree
          commit = request('/git/commits', {
              'message': 'fix(quality): enforce layer-wide conventions and static-analysis gates',
              'tree': created_tree['sha'], 'parents': [parent],
          })
          receipt = {'parent': parent, 'commit': commit['sha'], 'tree': local_tree, 'changed_paths': changed}
          (report / 'commit-receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2))
          (report / 'final.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: convention-verification-${{ github.sha }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 7
