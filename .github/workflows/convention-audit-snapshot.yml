name: Convention audit diagnostics

# Temporary branch-only diagnostics; removed before integration.
on:
  push:
    branches: [fix/convention-static-audit-20260918]

permissions:
  contents: read

jobs:
  python:
    name: Python layer diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REPORT_DIR: ${{ runner.temp }}/audit-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked --extra audit
      - name: Run every check and retain exact exits
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          report = pathlib.Path(os.environ['REPORT_DIR'])
          report.mkdir(parents=True)
          commands = {
              'ruff': 'ruff check core/ evals/ evolve/ tests/ scripts/ --output-format json',
              'format': 'ruff format --check core/ evals/ evolve/ tests/ scripts/',
              'types': 'mypy core/ evals/ evolve/ scripts/',
              'imports': 'lint-imports --no-cache',
              'dependencies': 'deptry .',
              'security': 'bandit -r core/ evals/ evolve/ -c pyproject.toml -f json',
              'script-security': 'bandit -r scripts/ -c pyproject.toml -f json',
              'annotations': 'ruff check core/ evals/ evolve/ --select ANN001,ANN002,ANN003,ANN201,ANN202,ANN204,ANN205,ANN206 --output-format json',
              'skill-python': 'ruff check --isolated --target-version py312 --select E4,E7,E9,F .geode/skills/ --output-format json',
              'exceptions': 'python scripts/check_architecture_exceptions.py --check --base-ref origin/develop',
              'inventory': 'python scripts/architecture_baseline.py --check',
              'hygiene': 'python scripts/check_repo_hygiene.py',
              'docs-map': 'python scripts/check_official_docs.py --check-map',
          }
          results = []
          for name, command in commands.items():
              argv = ['uv', 'run', '--no-sync', *command.split()]
              with (report / (name + '.log')).open('w') as output:
                  result = subprocess.run(argv, stdout=output, stderr=subprocess.STDOUT, check=False)
              results.append({'name': name, 'command': argv, 'exit_code': result.returncode})
              print(name, result.returncode, flush=True)
          (report / 'results.json').write_text(json.dumps(results, indent=2))
          sys.exit(int(any(row['exit_code'] for row in results)))
          PY
      - name: Preserve pinned Ruff binary for offline checks
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/audit-tools"
          cp .venv/bin/ruff "$RUNNER_TEMP/audit-tools/ruff"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-python-${{ github.sha }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-tools-${{ github.sha }}
          path: ${{ runner.temp }}/audit-tools
          if-no-files-found: error
          retention-days: 1

  site:
    name: Site layer diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: ${{ runner.temp }}/audit-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Run site checks
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          report = pathlib.Path(os.environ['REPORT_DIR'])
          report.mkdir(parents=True)
          commands = {
              'eslint': ['npm', 'run', 'lint', '--', '--max-warnings=0', '--format', 'json'],
              'typescript': ['npx', '--no-install', 'tsc', '--noEmit'],
              'npm-audit': ['npm', 'audit', '--audit-level=moderate', '--json'],
          }
          results = []
          for name, argv in commands.items():
              with (report / (name + '.log')).open('w') as output:
                  result = subprocess.run(argv, cwd='site', stdout=output, stderr=subprocess.STDOUT, check=False)
              results.append({'name': name, 'command': argv, 'exit_code': result.returncode})
              print(name, result.returncode, flush=True)
          (report / 'results.json').write_text(json.dumps(results, indent=2))
          sys.exit(int(any(row['exit_code'] for row in results)))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-site-${{ github.sha }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7

  automation:
    name: Workflow and shell diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: ${{ runner.temp }}/audit-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run automation checks
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          report = pathlib.Path(os.environ['REPORT_DIR'])
          report.mkdir(parents=True)
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.sh'], text=True).strip('\0').split('\0')
          commands = {
              'shellcheck-version': ['shellcheck', '--version'],
              'shellcheck': ['shellcheck', '--format=json', *files],
              'actionlint': [str(pathlib.Path.home() / 'go/bin/actionlint'), '-color'],
          }
          results = []
          for name, argv in commands.items():
              with (report / (name + '.log')).open('w') as output:
                  result = subprocess.run(argv, stdout=output, stderr=subprocess.STDOUT, check=False)
              results.append({'name': name, 'command': argv, 'exit_code': result.returncode})
              print(name, result.returncode, flush=True)
          (report / 'results.json').write_text(json.dumps(results, indent=2))
          sys.exit(int(any(row['exit_code'] for row in results)))
          PY
      - name: Preserve automation binaries
        if: always()
        run: |
          mkdir -p "$REPORT_DIR/tools"
          cp "$HOME/go/bin/actionlint" "$REPORT_DIR/tools/actionlint"
          cp "$(command -v shellcheck)" "$REPORT_DIR/tools/shellcheck"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-automation-${{ github.sha }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
