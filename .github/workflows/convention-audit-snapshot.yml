name: Convention audit verified export

# Temporary branch-scoped verification. The final tree removes this workflow
# and its input. Export is read-only; the connector performs all Git writes.
on:
  push:
    branches: [fix/convention-static-audit-20260918]
    paths: [.github/audit-edits.json, .github/audit-corrections.json, .github/workflows/convention-audit-snapshot.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/convention-static-audit-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Apply exact reviewed file edits
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', '4bb73b909f2c4abd1332784b1b1fd802832a48eb', 'HEAD'], check=True)
          root = pathlib.Path.cwd()
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verification'
          report.mkdir(parents=True, exist_ok=True)
          (report / 'source.json').write_text(json.dumps({'source_sha': os.environ['GITHUB_SHA']}))
          records = json.loads((root / '.github/audit-edits.json').read_text())
          records += json.loads((root / '.github/audit-corrections.json').read_text())
          paths = []
          for name, before, after, mode, edits in records:
              path = root / name
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              data = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(data).hexdigest() == before, name
              lines = data.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(edits):
                  lines[start:end] = [replacement]
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == after, name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(mode & 0o777)
              paths.append(name)
          for name in ['.github/audit-edits.json', '.github/audit-corrections.json', '.github/workflows/convention-audit-snapshot.yml']:
              (root / name).unlink()
              paths.append(name)
          subprocess.run(['git', 'add', '--update'], check=True)
          added = [name for name in paths if name != '.claude/hooks/check-progress.sh' and (root / name).exists()]
          subprocess.run(['git', 'add', '--', *added], check=True)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-paths.json').write_text(json.dumps(paths))
          PY
      - name: Install locked Python environment
        run: uv sync --locked --extra audit
      - name: Regenerate exact verified architecture inventory
        run: uv run python scripts/architecture_baseline.py --update
      - name: Install locked site environment
        run: npm ci
        working-directory: site
      - name: Reproduce generated files from the verified source
        working-directory: site
        run: |
          npm run sync-stats
          npm run build
          npm run export-md
          npm run verify-metadata
      - name: Preserve verified source and Git-object manifest before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYEXPORT'
          import json, os, pathlib, subprocess, tarfile, urllib.error, urllib.request
          root = pathlib.Path.cwd()
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verification'
          paths = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-paths.json').read_text())
          mirrors = [
              'AGENTS.md', 'docs/architecture/extensibility-roadmap.md',
              'site/src/data/geode/architecture-baseline.json',
              'site/src/data/geode/sot.ts', 'site/src/data/geode/changelog.ts',
              'site/public/llms.txt', 'site/public/llms-full.txt',
          ]
          subprocess.run(['git', 'add', '--', *mirrors], check=True)
          assert not subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip()
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed).issubset(set(paths + mirrors)), changed
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = []
          with tarfile.open(report / 'changed-source.tar.gz', 'w:gz') as archive:
              for name in changed:
                  path = root / name
                  if not path.exists():
                      tree.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                      continue
                  mode, sha = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[:2]
                  tree.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
                  archive.add(path, arcname=name, recursive=False)
          receipt = {
              'parent': os.environ['GITHUB_SHA'],
              'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'write-tree'], text=True).strip(),
              'verified_product_run': 35250804564,
              'entries': tree,
          }
          (report / 'tree-manifest.json').write_text(json.dumps(receipt, indent=2))
          (report / 'final.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          # Read-only object-presence probe. Publication uses the connected tool.
          observed = []
          for entry in tree:
              if entry['sha'] is None:
                  continue
              url = 'https://api.github.com/repos/mangowhoiscloud/geode/git/blobs/' + entry['sha']
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
                  if status != 404:
                      (report / 'probe-error.json').write_text(json.dumps({'path': entry['path'], 'status': status, 'body': error.read().decode()}))
                      break
              observed.append({'path': entry['path'], 'sha': entry['sha'], 'status': status})
          (report / 'blob-presence.json').write_text(json.dumps(observed, indent=2))
          print(json.dumps({key: value for key, value in receipt.items() if key != 'entries'}, indent=2))
          PYEXPORT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: convention-export-${{ github.sha }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 7
