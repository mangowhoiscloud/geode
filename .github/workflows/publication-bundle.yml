name: Publication bundle

# Publishes the GEODE publication bundle (docs/architecture/publication-bundle.md)
# as assets of one dedicated prerelease tagged `publication`. The tag is outside
# the v<version> namespace and the release is never marked latest, so the PyPI
# release path and the README "latest release" badge are unaffected. No workflow
# listens to release or tag events, and events made with GITHUB_TOKEN do not
# start workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-bundle
  cancel-in-progress: false

env:
  RELEASE_TAG: publication
  # mangowhois-site mirrors the bundles it pins to R2; release retention only
  # needs to outlive an open sync PR and leave room for a rollback.
  KEEP_BUNDLES: "10"

jobs:
  build:
    name: Build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Per-file committed_at needs full history; the builder refuses shallow clones.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync locked environment
        run: uv sync --locked

      - name: Build the bundle
        run: uv run python scripts/build_publication_bundle.py --out "$RUNNER_TEMP/publication-bundle"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-bundle
          path: ${{ runner.temp }}/publication-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write; it runs no repository code or dependencies.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-bundle
          path: ${{ runner.temp }}/publication-bundle

      - name: Upload the bundle, then move the latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/publication-bundle"
          shopt -s nullglob
          archives=("$dir"/geode-publication-*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected one bundle archive, found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          name="$(basename "$archive")"
          sha="${name#geode-publication-}"
          sha="${sha%.tar.gz}"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check --strict -
          tree="$(jq -er .tree_sha256 "$dir/manifest.json")"
          versioned="$dir/manifest-${sha}.json"
          cp "$dir/manifest.json" "$versioned"
          base="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"

          if ! gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPO" \
              --target "$TARGET_SHA" \
              --prerelease \
              --latest=false \
              --title "GEODE publication bundle" \
              --notes "Content-addressed GEODE publication bundles for the downstream site. Latest pointer: ${base}/manifest.json. Contract: docs/architecture/publication-bundle.md."
          fi
          test "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" = "true"
          release_id="$(gh api "repos/${REPO}/releases/tags/${RELEASE_TAG}" --jq .id)"

          list_assets() {
            gh api --paginate "repos/${REPO}/releases/${release_id}/assets?per_page=100" \
              --jq '.[] | [.id, .name, .created_at] | @tsv'
          }
          asset_id() {
            list_assets | awk -F '\t' -v wanted="$1" '$2 == wanted { print $1 }'
          }
          delete_asset() {
            if [ -n "$1" ]; then
              gh api -X DELETE "repos/${REPO}/releases/assets/$1"
            fi
          }

          pointer_id="$(asset_id manifest.json)"
          if [ -n "$pointer_id" ]; then
            current_tree="$(gh release download "$RELEASE_TAG" --repo "$REPO" \
              --pattern manifest.json --output - | jq -er .tree_sha256)"
            if [ "$current_tree" = "$tree" ]; then
              echo "Latest bundle already has tree_sha256 ${tree}; nothing to publish."
              exit 0
            fi
          fi

          # Content-addressed assets first; the same name always means the same bytes.
          for file in "$archive" "$versioned"; do
            existing="$(asset_id "$(basename "$file")")"
            if [ -z "$existing" ]; then
              gh release upload "$RELEASE_TAG" "$file" --repo "$REPO"
            fi
          done
          downloaded="$(curl -fsSL --retry 3 "${base}/${name}" | sha256sum | cut -d ' ' -f 1)"
          test "$downloaded" = "$sha"

          # Only now move the pointer: the archive it names is already public.
          next="$RUNNER_TEMP/manifest.json.next"
          ARCHIVE_NAME="$name" ARCHIVE_SHA="$sha" ARCHIVE_URL="${base}/${name}" \
            ARCHIVE_BYTES="$(stat -c %s "$archive")" \
            jq -S '. + {archive: {name: env.ARCHIVE_NAME, sha256: env.ARCHIVE_SHA,
              bytes: (env.ARCHIVE_BYTES | tonumber), url: env.ARCHIVE_URL}}' \
            "$dir/manifest.json" > "$next"
          for leftover in manifest.json.next manifest.json.prev; do
            leftover_id="$(asset_id "$leftover")"
            delete_asset "$leftover_id"
          done
          gh release upload "$RELEASE_TAG" "$next" --repo "$REPO"
          next_id="$(asset_id manifest.json.next)"
          old_id="$(asset_id manifest.json)"
          if [ -n "$old_id" ]; then
            gh api -X PATCH "repos/${REPO}/releases/assets/${old_id}" -f name=manifest.json.prev >/dev/null
          fi
          gh api -X PATCH "repos/${REPO}/releases/assets/${next_id}" -f name=manifest.json >/dev/null
          delete_asset "$old_id"

          published=""
          for _ in 1 2 3; do
            published="$(curl -fsSL "${base}/manifest.json" | jq -r .tree_sha256 || true)"
            if [ "$published" = "$tree" ]; then
              break
            fi
            sleep 5
          done
          test "$published" = "$tree"

          # Keep the newest KEEP_BUNDLES archives (and their manifests) plus the current one.
          gh api --paginate "repos/${REPO}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | select(.name | test("^geode-publication-[0-9a-f]{64}\\.tar\\.gz$")) | [.created_at, .name] | @tsv' \
            | sort -r | tail -n "+$((KEEP_BUNDLES + 1))" | cut -f 2 > "$RUNNER_TEMP/prune.txt"
          while IFS= read -r old; do
            if [ "$old" = "$name" ]; then
              continue
            fi
            old_sha="${old#geode-publication-}"
            old_sha="${old_sha%.tar.gz}"
            for asset in "$old" "manifest-${old_sha}.json"; do
              stale_id="$(asset_id "$asset")"
              delete_asset "$stale_id"
            done
          done < "$RUNNER_TEMP/prune.txt"
          echo "Published ${name} (tree_sha256 ${tree}) at ${base}/manifest.json"
