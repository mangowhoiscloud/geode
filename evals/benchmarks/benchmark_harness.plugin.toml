# GEODE upstream benchmark manifest.
#
# This file is intentionally public-safe: it contains only upstream repo
# coordinates, pinned commits, setup commands, and environment variable names.
# Secrets live in ignored `.mcp_env` files.

[benchmark_harness]
artifact_root = "artifacts/eval/harnesses"

[benchmark_harness.benchmark.mcpmark]
repo = "https://github.com/eval-sys/mcpmark.git"
commit = "cd45b7f57923b9b3985467f5139927575f83141c"
local_dir = "mcpmark"
python = "python3.12"
install = [
  "python3.12 -m venv .venv",
  ".venv/bin/python -m pip install --upgrade pip",
  ".venv/bin/pip install -e .",
  "uv sync --project ../../../.. --extra audit",
]
public_adapter = "evals.benchmarks.mcpmark_geode_agent"
required_env = []
optional_env = [
  "OPENAI_API_KEY",
  "SOURCE_NOTION_API_KEY",
  "EVAL_NOTION_API_KEY",
  "SOURCE_PARENT_PAGE_TITLE",
  "SOURCE_PARENT_PAGE_URL",
  "SOURCE_PARENT_PAGE_ID",
  "EVAL_PARENT_PAGE_TITLE",
  "EVAL_PARENT_PAGE_URL",
  "EVAL_PARENT_PAGE_ID",
  "PLAYWRIGHT_BROWSER",
  "PLAYWRIGHT_HEADLESS",
  "GITHUB_TOKENS",
  "GITHUB_EVAL_ORG",
  "DATABASE_URI",
]

[benchmark_harness.benchmark.tau2-bench]
repo = "https://github.com/sierra-research/tau2-bench.git"
commit = "79975ac5741e23fbb1d2ac44262d62398a6d87bd"
local_dir = "tau2-bench"
python = "python3.12"
install = ["uv sync --frozen"]
healthcheck = ["LITELLM_LOCAL_MODEL_COST_MAP=true .venv/bin/tau2 check-data"]
public_adapter = "evolve.crucible.tau2_geode_agent"
required_env = []
optional_env = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY", "ZHIPUAI_API_KEY"]
